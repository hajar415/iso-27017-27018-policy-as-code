name: ISO 27017/27018 Compliance Check

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'terraform/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'terraform/**'

jobs:
  checkov-scan:
    runs-on: ubuntu-latest
    name: Infrastructure Compliance Scan
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Checkov
        run: pip install checkov

      - name: Run Checkov Scan
        run: |
          checkov -d terraform/ \
            --framework terraform \
            --output cli
        continue-on-error: true