
name: ISO 27017/27018 Policy-as-Code Compliance Check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  checkov-compliance:
    runs-on: ubuntu-latest
    name: Checkov ISO Compliance Scan

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Checkov
        run: |
          python -m pip install --upgrade pip
          python -m pip install checkov==3.3.27

      - name: Run Checkov and preserve scan result
        id: checkov
        shell: bash
        run: |
          set +e

          checkov -d terraform/ \
            --framework terraform \
            --check CKV_AWS_24,CKV2_AWS_5,CKV2_AWS_61 \
            --output cli \
            --output json \
            --output-file-path console,checkov-results.json \
            --compact

          scan_exit_code=$?
          echo "exit_code=$scan_exit_code" >> "$GITHUB_OUTPUT"

          if [ ! -s checkov-results.json ]; then
            echo "::error::Checkov did not generate its JSON results."
            exit 2
          fi

          # Keep this step successful temporarily so that the report
          # can be generated and uploaded before compliance is enforced.
          exit 0

      - name: Generate French compliance report
        id: report
        run: |
          python scripts/generate_report.py \
            --input checkov-results.json \
            --mapping policies/control-mapping.json \
            --output reports/compliance-report.md

      - name: Upload compliance report and raw results
        id: upload_report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: iso-27017-27018-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/compliance-report.md
            checkov-results.json
          if-no-files-found: error
          retention-days: 14

      - name: Add download link to workflow summary
        if: ${{ always() && steps.upload_report.outcome == 'success' }}
        shell: bash
        env:
          ARTIFACT_URL: ${{ steps.upload_report.outputs.artifact-url }}
          SCAN_EXIT_CODE: ${{ steps.checkov.outputs.exit_code }}
        run: |
          echo "## Rapport Policy as Code" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "[Télécharger le rapport et les résultats JSON]($ARTIFACT_URL)" >> "$GITHUB_STEP_SUMMARY"

          if [ "$SCAN_EXIT_CODE" != "0" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "⚠️ Checkov a détecté des violations. La fusion doit rester bloquée." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Tous les contrôles Checkov sélectionnés ont réussi." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Enforce compliance result
        if: ${{ always() }}
        shell: bash
        env:
          CHECKOV_EXIT_CODE: ${{ steps.checkov.outputs.exit_code }}
          CHECKOV_OUTCOME: ${{ steps.checkov.outcome }}
          REPORT_OUTCOME: ${{ steps.report.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload_report.outcome }}
        run: |
          if [ "$CHECKOV_OUTCOME" != "success" ]; then
            echo "::error::Checkov did not complete successfully."
            exit 1
          fi

          if [ "$REPORT_OUTCOME" != "success" ]; then
            echo "::error::French report generation failed."
            exit 1
          fi

          if [ "$UPLOAD_OUTCOME" != "success" ]; then
            echo "::error::The report artifact could not be uploaded."
            exit 1
          fi

          if [ "$CHECKOV_EXIT_CODE" != "0" ]; then
            echo "::error::Compliance checks failed. Download the report artifact for details."
            exit 1
          fi

          echo "All selected Checkov controls passed."
