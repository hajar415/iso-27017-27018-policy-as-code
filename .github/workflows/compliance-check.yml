name: ISO 27017/27018 Policy-as-Code Compliance Check

on:
  pull_request:
    paths:
      - 'terraform/**'
  push:
    branches:
      - main
    paths:
      - 'terraform/**'

jobs:
  checkov-compliance:
    runs-on: ubuntu-latest
    name: Checkov Security & Compliance Scan

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Checkov scan
        id: checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform/
          external_checks_dir: custom_policies/
          check: CKV_AWS_1,CKV_AWS_24,CKV_AWS_26,CKV_AWS_27,CKV_AWS_34,CKV2_AWS_5,CKV2_AWS_61
          output_format: cli,json,sarif
          compact: false
          quiet: false
          soft_fail: false  # 🚫 BLOQUE si violations détectées

      - name: Display Checkov Results
        if: always()
        run: |
          echo "=========================================="
          echo "ISO 27017/27018 Compliance Check Results"
          echo "=========================================="
          
          if [ -f checkov_results.json ]; then
            echo "✅ Scan completed"
            echo ""
            echo "Summary:"
            python3 - << 'EOF'
            import json
            with open('checkov_results.json') as f:
              data = json.load(f)
            print(f"Passed Checks: {data.get('summary', {}).get('passed', 0)}")
            print(f"Failed Checks: {data.get('summary', {}).get('failed', 0)}")
            print(f"Skipped Checks: {data.get('summary', {}).get('skipped', 0)}")
            EOF
          fi

      - name: Comment PR with Results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('checkov_results.json')) {
              const results = JSON.parse(fs.readFileSync('checkov_results.json', 'utf8'));
              const summary = results.summary || {};
              
              const comment = `## 🔒 ISO 27017/27018 Compliance Check Results
              
              ### Summary
              - ✅ Passed: ${summary.passed || 0}
              - ❌ Failed: ${summary.failed || 0}
              - ⏭️ Skipped: ${summary.skipped || 0}
              
              ${summary.failed > 0 ? '### ⚠️ Deployment will be BLOCKED until all violations are fixed' : '### ✅ All compliance checks passed!'}
              
              [View detailed report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
              `;
              
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            }

      - name: Fail if violations found
        if: ${{ steps.checkov.outcome == 'failure' }}
        run: |
          echo "❌ Policy-as-Code violations detected!"
          echo "🚫 Deployment BLOCKED"
          echo ""
          echo "To fix violations:"
          echo "1. Review the checks above"
          echo "2. Update your Terraform configuration"
          echo "3. Ensure encryption, network segmentation, and logging are enabled"
          exit 1
