name: ISO 27017/27018 Strict Compliance Gate

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'terraform/**'

jobs:
  compliance-gate:
    runs-on: ubuntu-latest
    name: Compliance Check - Block Non-Conforming Code
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Checkov
        run: pip install checkov

      - name: Run Checkov - Fail on Critical Issues
        run: |
          checkov -d terraform/ \
            --framework terraform \
            --check CKV_AWS_24,CKV_AWS_145,CKV_AWS_133 \
            --hard-fail-on CKV_AWS_24 \
            --hard-fail-on CKV_AWS_145 \
            --output cli

      - name: Generate Compliance Report
        if: always()
        run: |
          checkov -d terraform/ \
            --framework terraform \
            --output junitxml > checkov-report.xml || true

      - name: Post Results to PR
        if: always()
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🔒 **ISO 27017/27018 Compliance Gate Activated**\n\n✅ Checkov scan completed. Critical violations will block merge.\n\n**Key Rules:**\n- CKV_AWS_24: SSH access restricted\n- CKV_AWS_145: S3 uses KMS encryption\n- CKV_AWS_133: RDS backups enabled'
            })

      - name: Block on Failures
        if: failure()
        uses: actions/github-script@v6
        with:
          script: |
            core.setFailed('Compliance check failed. Fix violations before merging.')